apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapi
  namespace: nodc
  labels:
    role: webapi
spec:
  replicas: 1
  selector:
    matchLabels:
      role: webapi
  template:
    metadata:
      labels:
        role: webapi
    spec:
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: webapi-settings
      containers:
        - name: webapi
          image: fra.ocir.io/frcivyrwah5e/wpnkod-webapi:latest
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
          env:
            - name: Jwt__Issuer
              value: https://data.slovensko.sk/
            - name: Jwt__Audience
              value: https://data.slovensko.sk/
            - name: Jwt__Key
              valueFrom:
                secretKeyRef:
                  name: nkod-secrets
                  key: JwtPublicKey
            - name: DocumentStorageUrl
              value: http://documentstorage.nodc.svc.cluster.local:6002
            - name: CodelistProviderUrl
              value: http://codelistprovider:6003
            - name: IAMUrl
              value: http://iam:6004
            - name: PublicSparqlEndpoint
              value: /api/sparql
            - name: PrivateSparqlEndpoint
              value: http://nodc-graphdb:7200/repositories/nodc
            - name: HarvesterAuthToken
              valueFrom:
                secretKeyRef:
                  name: nkod-secrets
                  key: HarvesterAuthToken
            - name: NotificationService
              value: http://notificationservice
            - name: MonitoringSettingsUrl
              value: http://monitoring-settings
            - name: TZ
              value: Europe/Bratislava
            - name: AppSettingsFilePath
              value: /etc/app/config.json
          volumeMounts:
            - name: config
              mountPath: /etc/app
          imagePullPolicy: Always
      restartPolicy: Always
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: oci-registry-secret
